version: '3.8'

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  postgres:
    image: postgres:16-alpine
    container_name: bd-identidade
    environment:
      POSTGRES_DB: db_identidade
      POSTGRES_USER: vet_postgres
      POSTGRES_PASSWORD: vet_admin
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vet_postgres -d db_identidade"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: